version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:3.6
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db
    volumes:
      - mlflow-data:/mlruns

  trainer:
    build: .
    depends_on:
      - kafka
      - mlflow
    volumes:
      - ./models:/app/models
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: python -m src.rl.train --config config/config.yaml

  inference:
    build: .
    depends_on:
      - trainer
    volumes:
      - ./models:/app/models
    ports:
      - "8000:8000"
    command: python -m src.inference.service --model models/ppo_dungeon.zip

  telemetry-consumer:
    build: .
    depends_on:
      - kafka
    command: python -m src.telemetry.consumer --bootstrap kafka:9092

volumes:
  mlflow-data:
