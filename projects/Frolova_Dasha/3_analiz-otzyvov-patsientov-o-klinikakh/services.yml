name: clinic-reviews

services:
  api:
    build: .
    command: ["uvicorn", "api:api", "--host", "0.0.0.0", "--port", "8013"]
    environment:
      PRODUCTION_MODE: "true"
      REVIEW_CLASSIFIER: corpus
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://clinicreviews:clinicreviews@postgres:5432/clinicreviews
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["8013:8013"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
  worker:
    build: .
    command: ["python", "worker.py"]
    environment: { KAFKA_BOOTSTRAP_SERVERS: "kafka:9092", ELASTICSEARCH_URL: "http://elasticsearch:9200" }
    depends_on:
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck: { test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"], interval: 10s, timeout: 5s, retries: 12, start_period: 20s }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: clinicreviews, POSTGRES_USER: clinicreviews, POSTGRES_PASSWORD: clinicreviews }
    volumes: ["clinic_postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U clinicreviews -d clinicreviews"], interval: 5s, timeout: 3s, retries: 10 }
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment: [discovery.type=single-node, xpack.security.enabled=false, ES_JAVA_OPTS=-Xms512m -Xmx512m]
    volumes: ["clinic_search:/usr/share/elasticsearch/data"]
    healthcheck: { test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"], interval: 15s, timeout: 5s, retries: 12 }

volumes:
  clinic_postgres:
  clinic_search:
